<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDA557"/>
      <stop offset="1" stop-color="#9A7B2E"/>
    </linearGradient>
  </defs>
  <!-- Light ivory field -->
  <rect width="64" height="64" rx="15" fill="#F7F2E9"/>
  <!-- Fine gold hairline frame -->
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="11.5" fill="none" stroke="url(#gold)" stroke-width="1.4"/>
  <!-- Navy serif monogram -->
  <text x="32" y="43.5" font-family="Georgia, 'Bodoni Moda', 'Times New Roman', serif" font-size="31" font-weight="600" letter-spacing="0.5" text-anchor="middle" fill="#1B2C46">DP</text>
</svg>
