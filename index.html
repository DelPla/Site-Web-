<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:type" content="website" />
    <title>Delphine Planes — Global Sourcing &amp; Supplier Management</title>
    <meta
      name="description"
      content="Global fluency is the new alpha in supplier management. Two decades of international procurement across China, Taiwan and Korea — where data meets human relationships."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Netlify Identity is only loaded for the invite/recovery link itself
      // (its URL carries #invite_token=... or #recovery_token=...). Regular
      // visitors never trigger this — no third-party request on normal visits.
      if (/(invite_token|recovery_token|confirmation_token)=/.test(window.location.hash)) {
        var s = document.createElement("script");
        s.src = "https://identity.netlify.com/v1/netlify-identity-widget.js";
        s.onload = function () {
          window.netlifyIdentity.on("init", (user) => {
            if (!user) {
              window.netlifyIdentity.on("login", () => {
                document.location.href = "/admin/";
              });
            }
          });
        };
        document.head.appendChild(s);
      }
    </script>
  </body>
</html>
